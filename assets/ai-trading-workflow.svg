<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">NIGHT CROWS TRADING AI 量化交易流程</title>
  <desc id="desc">AI 研究沉淀经过回测与前向验证，结合盘中行情研判，由风控与仓位计划约束模拟交易，成交和复盘回流研究知识库。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#65d5bd" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text {font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}
    .box {fill:#152638;stroke:#36506b;stroke-width:1.5}
    .label {fill:#f1f7fb;font-size:24px;font-weight:600}
    .detail {fill:#b2c5d7;font-size:18px}
    .step {fill:#78e0ca;font-size:15px;letter-spacing:2px}
    .flow {fill:none;stroke:#65d5bd;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <rect width="1000" height="500" rx="18" fill="#0b1523"/>
  <text x="32" y="37" fill="#afc9dd" font-size="17" letter-spacing="1">NIGHT CROWS TRADING · RESEARCH TO EXECUTION</text>
  <rect class="box" x="30" y="65" width="280" height="140" rx="12"/>
  <text class="step" x="50" y="97">01 / RESEARCH</text>
  <text class="label" x="50" y="135">AI 研究沉淀</text>
  <text class="detail" x="50" y="169">专业论文 · 公开策略 · 自身实验</text>
  <rect class="box" x="360" y="65" width="280" height="140" rx="12"/>
  <text class="step" x="380" y="97">02 / VALIDATION</text>
  <text class="label" x="380" y="135">回测与前向验证</text>
  <text class="detail" x="380" y="169">规则候选 · 成本检查 · 连续观察</text>
  <rect class="box" x="690" y="65" width="280" height="140" rx="12"/>
  <text class="step" x="710" y="97">03 / DECISION</text>
  <text class="label" x="710" y="135">盘中行情研判</text>
  <text class="detail" x="710" y="169">量价突破 · 相对强弱 · 持仓状态</text>
  <rect class="box" x="690" y="300" width="280" height="140" rx="12"/>
  <text class="step" x="710" y="332">04 / RISK</text>
  <text class="label" x="710" y="370">风控与仓位计划</text>
  <text class="detail" x="710" y="404">风险预算 · T+1 · 可卖与名额</text>
  <rect class="box" x="360" y="300" width="280" height="140" rx="12"/>
  <text class="step" x="380" y="332">05 / EXECUTION</text>
  <text class="label" x="380" y="370">自动模拟交易</text>
  <text class="detail" x="380" y="404">分层买卖 · 换仓 · 成交核对</text>
  <rect class="box" x="30" y="300" width="280" height="140" rx="12"/>
  <text class="step" x="50" y="332">06 / FEEDBACK</text>
  <text class="label" x="50" y="370">决策归档与复盘</text>
  <text class="detail" x="50" y="404">来源引用 · 执行证据 · 版本反馈</text>
  <path class="flow" d="M312 135H347"/>
  <path class="flow" d="M642 135H677"/>
  <path class="flow" d="M830 208V286"/>
  <path class="flow" d="M688 370H653"/>
  <path class="flow" d="M358 370H323"/>
  <path class="flow" d="M170 298V220"/>
  <text class="detail" x="188" y="256">研究反馈</text>
  <text x="32" y="478" fill="#a3bcd0" font-size="17">AI 提出研究与研判 · 引擎执行规则与风控 · 证据支持后续迭代</text>
</svg>
