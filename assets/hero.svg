    <linearGradient id="line" x1="52" y1="0" x2="1148" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#7ee6cf"/><stop offset="1" stop-color="#65afda"/></linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="64" y2="64"><stop stop-color="#d0f3f3"/><stop offset="1" stop-color="#527b92"/></linearGradient>
  </defs>
