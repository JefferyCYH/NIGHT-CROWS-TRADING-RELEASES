    <g transform="translate(52 301)"><rect width="251" height="96" rx="11" fill="#152839" stroke="#334f61"/><text x="18" y="29" fill="#82daca" font-size="12" letter-spacing="2">01 / RESEARCH</text><text x="18" y="61" fill="#e5edf4" font-size="23" font-weight="600">论文与经历研究</text><text x="18" y="83" fill="#97aebb" font-size="13">从资料与模拟反馈提出假设</text></g>
