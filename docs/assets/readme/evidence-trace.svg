  <text x="590" y="204" font-family="'HarmonyOS Sans SC', 'Microsoft YaHei UI', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#e2e8f0">冻结轮次 #17 现金预留规则拦截</text>
